name: Build

on:
  push:
    branches: [ "ci-workflow", "main" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    uses: eclipse-ecsp/.github/.github/workflows/workflow-nodejs-build.yml@nodejs
    with:
      node-version: '20'
      sonar-analysis: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  extract-version:
    runs-on: ubuntu-latest
    needs: build-and-test
    name: Extract application version
    outputs:
      application_version: ${{ steps.set_version.outputs.application_version }}
    steps:
      - id: set_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "application_version=${version}" >> $GITHUB_ENV
          echo "::set-output name=application_version::${version}"

  docker-push:
    needs: [build-and-test, extract-version]
    uses: eclipse-ecsp/.github/.github/workflows/workflow-nodejs-docker-push.yml@nodejs
    if: true # Disable docker push on normal builds
    with:
      registry: "docker.io"
      image-name: "hello-world-service"
      image-tag: ${{ needs.extract-version.outputs.application_version }}
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_API_TOKEN: ${{ secrets.DOCKER_API_TOKEN }}
